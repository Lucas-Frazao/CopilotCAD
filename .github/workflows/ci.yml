name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (OCCT on Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: "2.8.1"
          environment-name: copilotcad-ci
          create-args: >-
            python=3.11
            pythonocc-core>=7.7
            pytest>=8
            pydantic>=2.7
            pyyaml>=6
            ruamel.yaml>=0.18
            anthropic>=0.28
            jsonrpcserver>=5
            setuptools<81
          cache-environment: true
          cache-environment-key: backend-${{ hashFiles('backend/pyproject.toml') }}

      - name: Verify OCCT import
        run: python -c "from OCC.Core.TopoDS import TopoDS_Shape; print('OCCT OK')"

      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python -m pytest tests/backend -v --tb=short

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
