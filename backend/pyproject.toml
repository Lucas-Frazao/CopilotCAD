[project]
name = "copilotcad-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.7",
  "pythonocc-core>=7.7",
  "anthropic>=0.28",
  "ruamel.yaml>=0.18",
  "jsonrpcserver>=5.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests/backend"]

[tool.ruff]
line-length = 100
